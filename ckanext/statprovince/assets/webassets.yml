# ชื่อไฟล์ขึ้นต้นด้วย "statprovince-" เพราะ webassets ค้น path ใน contents จากทุก extension + core
# (ชื่อทั่วไปอย่าง css/home.css อาจไปได้ไฟล์ของคนอื่นแทน)
# ไม่ใช้ filters: cssrewrite — กับโฟลเดอร์ assets/ จะ error "Cannot determine url" ในโหมด production
# รูปใน CSS ให้อ้าง absolute เช่น url('/statprovince/images/background_PSC.png')

footer_css:
  output: statprovince/%(version)s_statprovince-footer.css
  contents:
    - css/statprovince-footer.css

header_css:
  output: statprovince/%(version)s_statprovince-header.css
  contents:
    - css/statprovince-header.css

graph_css:
  output: statprovince/%(version)s_statprovince-graph.css
  contents:
    - css/statprovince-graph.css

graph_js:
  filter: rjsmin
  output: statprovince/%(version)s_statprovince-graph.js
  contents:
    - js/statprovince-graph.js

home_css:
  output: statprovince/%(version)s_statprovince-home.css
  contents:
    - css/statprovince-home.css

home_js:
  filter: rjsmin
  output: statprovince/%(version)s_statprovince-home.js
  contents:
    - js/statprovince-home.js
